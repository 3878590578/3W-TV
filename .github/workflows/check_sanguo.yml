name: 检测三国.txt

on:
  push:
    paths:
      - "三国.txt"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装 requests
        run: |
          pip install requests

      - name: 检测三国.txt
        run: |
          python scripts/check_proxy.py 三国.txt 已筛.txt

      - name: 提交已筛.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 已筛.txt

          if git diff --cached --quiet; then
            echo "已筛.txt 没有变化"
            exit 0
          fi

          git commit -m "自动更新已筛.txt"
          git push
